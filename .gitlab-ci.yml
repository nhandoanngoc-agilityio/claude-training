# Mirrors .github/workflows/ci.yml: install from the lockfile and run the tests.
# Uses Astral's uv image so no install step is needed.
stages:
  - test

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  script:
    - uv sync --locked
    - uv run pytest -q
  rules:
    - if: $CI_COMMIT_BRANCH
